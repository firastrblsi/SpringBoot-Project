spring.application.name=librairie

# Connexion à la base H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:librairie
spring.datasource.username=sa
spring.datasource.password=

# Active la console web de H2
spring.h2.console.enabled=true

# Affiche les requêtes SQL
spring.jpa.show-sql=true

# Création de la base de données par Hibernate
spring.jpa.hibernate.ddl-auto=create-drop

# Exécution de data.sql après création du schéma
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8